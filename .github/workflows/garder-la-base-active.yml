# Le plan gratuit de Supabase met un projet en pause après environ une semaine sans activité.
# Cette tâche interroge la base une fois par jour pour la garder active.
name: Garder la base active
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger la base
        run: |
          URL=$(node -e "global.window={};require('./config.js');console.log(window.DIXBALLES.supabaseUrl||'')")
          KEY=$(node -e "global.window={};require('./config.js');console.log(window.DIXBALLES.supabaseKey||'')")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Base pas encore configurée dans config.js"; exit 0; fi
          curl -fsS "$URL/rest/v1/plans?select=id&limit=1" -H "apikey: $KEY" > /dev/null
          echo "Base active."
